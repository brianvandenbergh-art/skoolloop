<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkoolLoop - Enterprise School & Diary Cloud</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --surface: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-lg: 0 15px 30px -4px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #e2e8f0; color: var(--text); min-height: 100vh; padding: 16px 8px; display: flex; justify-content: center; }

    /* Top Presentation Bar (Allows quick role demonstration) */
    .presenter-bar {
      max-width: 1260px;
      margin: 0 auto 12px auto;
      background: #0f172a;
      color: #94a3b8;
      padding: 10px 18px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 10px;
    }
    .presenter-bar select, .presenter-bar button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Main App Frame */
    .app-frame {
      width: 100%;
      max-width: 1260px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 88vh;
      position: relative;
    }
    .app-frame.mobile-mode { max-width: 430px; border-radius: 28px; }

    /* Custom School Header Banner with dynamic background */
    .school-hero-header {
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?w=1200') center/cover;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }
    .school-identity { display: flex; align-items: center; gap: 14px; }
    .school-crest-img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #fff;
      border: 2px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: 800;
      color: var(--primary);
      font-size: 18px;
    }
    .school-crest-img img { width: 100%; height: 100%; object-fit: cover; }

    /* Emergency Alert Bar */
    .urgent-banner {
      background: linear-gradient(90deg, #dc2626, #b91c1c);
      color: #fff;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Core App Body */
    .app-core {
      display: grid;
      grid-template-columns: 240px 1fr;
      flex: 1;
      background: #fff;
    }
    @media (max-width: 860px) {
      .app-core { grid-template-columns: 1fr; }
      .app-sidebar { display: none; }
    }
    .app-frame.mobile-mode .app-core { grid-template-columns: 1fr; }
    .app-frame.mobile-mode .app-sidebar { display: none; }

    /* Role-Specific Sidebar */
    .app-sidebar {
      background: #fafbfc;
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .nav-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin: 10px 0 6px 8px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      margin-bottom: 4px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: #f1f5f9; color: var(--text); }
    .nav-btn.active { background: var(--primary-light); color: var(--primary); }

    /* Main Content */
    .main-viewport {
      padding: 24px;
      background: #ffffff;
      overflow-y: auto;
      max-height: calc(88vh - 120px);
    }

    /* 2 Column Layout */
    .layout-2col { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    @media (max-width: 1060px) { .layout-2col { grid-template-columns: 1fr; } }
    .app-frame.mobile-mode .layout-2col { grid-template-columns: 1fr; }

    /* Cards */
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    /* Pills & Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .pill-primary { background: var(--primary-light); color: var(--primary); }
    .pill-success { background: var(--success-light); color: var(--success); }
    .pill-danger { background: var(--danger-light); color: var(--danger); }
    .pill-warning { background: var(--warning-light); color: var(--warning); }

    /* Child Switcher Tabs */
    .child-tabs-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      background: #f8fafc;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .child-tab-pill {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
    }
    .child-tab-pill.active { background: #fff; color: var(--text); box-shadow: var(--shadow); }

    /* Task Item Card */
    .task-card {
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
      transition: all 0.2s;
    }
    .task-card.in-progress { border-color: #fde68a; background: #fffdf5; }
    .task-card.completed { border-color: #a7f3d0; background: #f0fdf4; opacity: 0.85; }
    .task-card.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

    /* Daily Challenge Widget */
    .challenge-card {
      background: linear-gradient(135deg, #4338ca, #6366f1);
      color: #fff;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; border-color: var(--border); color: #334155; }
    .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-danger-soft { background: var(--danger-light); color: var(--danger); border-color: #fecaca; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background:#fff; }

    /* Modals & Toast */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-card { background: #fff; border-radius: 16px; max-width: 480px; width: 100%; overflow: hidden; }
    .toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #0f172a; color: #fff;
      padding: 12px 18px; border-radius: 10px;
      font-size: 13px; box-shadow: var(--shadow-lg); z-index: 1000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div style="width:100%; max-width:1260px;">

  <!-- Presenter Switcher Bar (Test any role live) -->
  <div class="presenter-bar">
    <div>
      <span>🖥️ Screen Mode:</span>
      <select onchange="toggleDevice(this.value)">
        <option value="desktop">Laptop / Desktop</option>
        <option value="mobile">Smartphone View (PWA)</option>
      </select>
    </div>

    <div>
      <span>🎭 Active Logged-in Persona:</span>
      <select id="personaSelector" onchange="switchPersona(this.value)">
        <option value="parent">👨‍👩‍👧 Parent: Mrs. Mokoena (Thabo & Lerato)</option>
        <option value="student">🎓 Student: Thabo (Gr 9 - High School)</option>
        <option value="teacher">👨‍🏫 Teacher: Mr. van der Merwe (Woodwork)</option>
        <option value="admin">🏫 School Office: Mrs. Botha (Receptionist)</option>
      </select>
    </div>

    <div>
      <button onclick="document.getElementById('crestInput').click()">🖼️ Upload Crest</button>
      <input type="file" id="crestInput" accept="image/*" style="display:none" onchange="uploadCrest(this)" />
      <button onclick="resetData()" style="background:#dc2626;">🔄 Reset Demo</button>
    </div>
  </div>

  <!-- App Surface -->
  <div class="app-frame" id="appFrame">
    
    <!-- Emergency Banner (Controlled by School Office) -->
    <div class="urgent-banner" id="urgentBanner">
      <span id="bannerText">📢 <strong>Notice:</strong> School closes early today at 12:30 due to Interhigh Athletics.</span>
      <span class="pill" style="background:rgba(255,255,255,0.2); color:#fff;" id="bannerTarget">Grades 4–12</span>
    </div>

    <!-- Branded School Header with Background -->
    <header class="school-hero-header" id="schoolHero">
      <div class="school-identity">
        <div class="school-crest-img" id="crestBox">
          <span id="crestInitials">LM</span>
          <img id="crestImg" class="hidden" src="" alt="Crest" />
        </div>
        <div>
          <h1 style="font-size:17px; font-weight:700;" id="schoolNameHeader">Laerskool Malelane / Hoërskool</h1>
          <p style="font-size:11px; opacity:0.9;">🔒 POPIA Certified • Encrypted Diary Cloud</p>
        </div>
      </div>

      <div>
        <span class="pill pill-primary" id="personaBadge">Parent Portal</span>
      </div>
    </header>

    <!-- Core App Body -->
    <div class="app-core">
      
      <!-- Role-Based Navigation Sidebar -->
      <aside class="app-sidebar" id="appSidebar">
        <!-- Injected dynamically by active role -->
      </aside>

      <!-- Main Dynamic Viewport -->
      <main class="main-viewport" id="mainViewport">
        <!-- Rendered dynamically by active role & tab -->
      </main>

    </div>

  </div>

</div>

<!-- Absence & Doctor's Note Modal -->
<div id="absenceModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div style="padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <strong>🏥 Submit Doctor's Note / Absence</strong>
      <button onclick="closeModal('absenceModal')" style="border:none; background:none; font-size:18px; cursor:pointer;">&times;</button>
    </div>
    <div style="padding:18px;">
      <div class="form-group">
        <label class="form-label">Learner</label>
        <select class="form-input" id="absenceChildSelect">
          <option>Thabo Mokoena (Grade 9B)</option>
          <option>Lerato Mokoena (Grade 4A)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Reason</label>
        <select class="form-input">
          <option>Illness (Doctor visited / Medical Certificate)</option>
          <option>Family Emergency</option>
          <option>Provincial Sport Tour</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">📸 Snap Photo of Doctor's Note (Doktersbrief)</label>
        <input type="file" accept="image/*" capture="environment" class="form-input" />
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="submitAbsence()">📨 Submit to Register Teacher</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
  // Complete State Engine (Persisted in LocalStorage)
  const defaultState = {
    activePersona: 'parent', // parent | student | teacher | admin
    activeTab: 'diary',
    activeChild: 'thabo',
    banner: { text: "School closes early today at 12:30 due to Interhigh Athletics.", target: "Grades 4–12" },
    children: {
      thabo: {
        name: "Thabo Mokoena",
        grade: "Grade 9B",
        school: "Hoërskool Centurion",
        type: "high",
        tasks: [
          { id: 't1', subject: 'Woodwork / Houtwerk', teacher: 'Mnr. J. van der Merwe', title: 'Isometric Joint Drawing #3', desc: 'Complete drawing on page 32 in A3 book. Sharpen chisel for workshop.', due: 'Tomorrow', timestamp: 1726580000000, status: 'in-progress', boardImg: 'https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=600' },
          { id: 't2', subject: 'Mathematics', teacher: 'Mev. S. Naidoo', title: 'Algebraic Fractions Ex 4.2', desc: 'Sums 1 to 8 in blue exercise book.', due: 'Tomorrow', timestamp: 1726570000000, status: 'completed', boardImg: null },
          { id: 't3', subject: 'Natural Sciences', teacher: 'Mnr. D. Smit', title: 'Periodic Table Summary', desc: 'Summarize elements 1 to 20.', due: 'Friday', timestamp: 1726560000000, status: 'not-started', boardImg: null }
        ]
      },
      lerato: {
        name: "Lerato Mokoena",
        grade: "Grade 4A",
        school: "Laerskool Malelane",
        type: "primary",
        tasks: [
          { id: 'l1', subject: 'Wiskunde', teacher: 'Juf. M. du Plessis', title: 'Maaltafels Bladsy 28', desc: 'Doen somme 1 tot 8 in geel werkboek.', due: 'Tomorrow', timestamp: 1726581000000, status: 'completed', boardImg: null },
          { id: 'l2', subject: 'English FAL', teacher: 'Mrs. E. Smith', title: 'Reading Record Sign-off', desc: 'Read Chapter 4 aloud and get parent signature in diary.', due: 'Tomorrow', timestamp: 1726579000000, status: 'completed', boardImg: null }
        ]
      }
    },
    events: [
      { id: 'e1', title: 'Interhigh Athletics (Vroeg Sluit)', date: 'Today at 12:30', eligibility: 'Grades 4–12 (Gr R–3 Excluded)', type: 'sport' },
      { id: 'e2', title: 'Graad 9 Lente Sokkie 🎉', date: 'Vrydag 18:00 - 22:00', eligibility: 'Hoërskool Gr 8–12 Only', type: 'social' },
      { id: 'e3', title: 'Wiskunde Kwartaaltoets', date: '25 September', eligibility: 'Graad 9 Leerders', type: 'exam' },
      { id: 'e4', title: 'Ouer Aand (Parent Evening)', date: '28 September 17:30', eligibility: 'All Parents', type: 'meeting' }
    ],
    news: {
      title: "Nuusbrief #28 • Kwartaal 3",
      bullets: [
        "Vrydag is Civvies Dag (R10 vir liefdadigheid).",
        "Rugby vs Nelspruit begin 14:00 op A-Veld.",
        "Skoolgeld betalings betaalbaar voor 30 September."
      ]
    },
    classes: {
      wood9: {
        title: "Gr 9 Woodwork (Mnr. van der Merwe)",
        students: [
          { name: "Thabo Mokoena", status: "Done (17:35)", absent: false },
          { name: "Sipho Khumalo", status: "Done (18:10)", absent: false },
          { name: "Liam Nel", status: "Absent (Doktersbrief Attached)", absent: true, doctorNote: true },
          { name: "Anika Botha", status: "Incomplete", absent: false }
        ]
      }
    }
  };

  let state = JSON.parse(localStorage.getItem('skoolloop_v3')) || defaultState;
  function save() { localStorage.setItem('skoolloop_v3', JSON.stringify(state)); }

  window.onload = function() {
    renderAll();
  };

  function renderAll() {
    renderHeader();
    renderSidebar();
    renderMain();
  }

  function renderHeader() {
    document.getElementById('bannerText').innerHTML = `📢 <strong>Notice:</strong> ${state.banner.text}`;
    document.getElementById('bannerTarget').innerText = state.banner.target;
    
    const pBadge = document.getElementById('personaBadge');
    if (state.activePersona === 'parent') { pBadge.innerText = 'Parent Portal'; pBadge.className = 'pill pill-primary'; }
    if (state.activePersona === 'student') { pBadge.innerText = 'Student Account (Gr 9)'; pBadge.className = 'pill pill-warning'; }
    if (state.activePersona === 'teacher') { pBadge.innerText = 'Teacher Dashboard'; pBadge.className = 'pill pill-success'; }
    if (state.activePersona === 'admin') { pBadge.innerText = 'School Office'; pBadge.className = 'pill pill-danger'; }
  }

  // Render Role-Specific Sidebar
  function renderSidebar() {
    const sb = document.getElementById('appSidebar');
    if (state.activePersona === 'parent') {
      sb.innerHTML = `
        <div>
          <div class="nav-label">PARENT MENU</div>
          <div class="nav-btn ${state.activeTab==='diary'?'active':''}" onclick="setTab('diary')">📋 Homework Diary</div>
          <div class="nav-btn ${state.activeTab==='events'?'active':''}" onclick="setTab('events')">🎉 Events, Sokkies & Exams</div>
          <div class="nav-btn ${state.activeTab==='news'?'active':''}" onclick="setTab('news')">📰 Newsletters (Nuusbriewe)</div>
          <div class="nav-btn" onclick="openModal('absenceModal')">🏥 Report Sick / Doctor Note</div>
        </div>
        <div style="padding:10px; background:#fff; border:1px solid var(--border); border-radius:8px; font-size:11px;">
          <strong>🔒 POPIA Protected</strong><br>Only you see your children's tasks.
        </div>
      `;
    } else if (state.activePersona === 'student') {
      sb.innerHTML = `
        <div>
          <div class="nav-label">STUDENT PORTAL</div>
          <div class="nav-btn ${state.activeTab==='diary'?'active':''}" onclick="setTab('diary')">📚 My 7 Subjects & Tasks</div>
          <div class="nav-btn ${state.activeTab==='events'?'active':''}" onclick="setTab('events')">🎉 Sokkies & Sport Events</div>
          <div class="nav-btn ${state.activeTab==='challenge'?'active':''}" onclick="setTab('challenge')">⚡ Daily Brain Challenge</div>
        </div>
      `;
    } else if (state.activePersona === 'teacher') {
      sb.innerHTML = `
        <div>
          <div class="nav-label">TEACHER MENU</div>
          <div class="nav-btn ${state.activeTab==='teach-post'?'active':''}" onclick="setTab('teach-post')">⚡ 10s Task Poster</div>
          <div class="nav-btn ${state.activeTab==='teach-roster'?'active':''}" onclick="setTab('teach-roster')">👥 Class Roll Call & Inspection</div>
          <div class="nav-btn ${state.activeTab==='events'?'active':''}" onclick="setTab('events')">📅 School Calendar</div>
        </div>
      `;
    } else {
      sb.innerHTML = `
        <div>
          <div class="nav-label">OFFICE / ADMIN MENU</div>
          <div class="nav-btn ${state.activeTab==='admin-broadcast'?'active':''}" onclick="setTab('admin-broadcast')">🚨 Emergency Early Closure</div>
          <div class="nav-btn ${state.activeTab==='admin-news'?'active':''}" onclick="setTab('admin-news')">📰 Publish Weekly Newsletter</div>
          <div class="nav-btn ${state.activeTab==='admin-events'?'active':''}" onclick="setTab('admin-events')">📅 Manage Events & Sokkies</div>
        </div>
      `;
    }
  }

  // Render Viewport
  function renderMain() {
    const main = document.getElementById('mainViewport');
    
    // Parent View
    if (state.activePersona === 'parent') {
      if (state.activeTab === 'diary') renderParentDiary(main);
      if (state.activeTab === 'events') renderEventsView(main);
      if (state.activeTab === 'news') renderNewsView(main);
    } 
    // Student View
    else if (state.activePersona === 'student') {
      if (state.activeTab === 'diary') renderStudentDiary(main);
      if (state.activeTab === 'events') renderEventsView(main);
      if (state.activeTab === 'challenge') renderChallengeView(main);
    }
    // Teacher View
    else if (state.activePersona === 'teacher') {
      renderTeacherDashboard(main);
    }
    // Admin View
    else {
      renderAdminDashboard(main);
    }
  }

  // ================= PARENT & STUDENT SCREENS =================
  function renderParentDiary(main) {
    const child = state.children[state.activeChild];
    
    // Sort tasks: uncompleted first, completed at bottom
    const sorted = [...child.tasks].sort((a, b) => {
      if (a.status === 'completed' && b.status !== 'completed') return 1;
      if (a.status !== 'completed' && b.status === 'completed') return -1;
      return 0;
    });

    let taskCardsHtml = sorted.map(t => `
      <div class="task-card ${t.status}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="pill pill-primary">${t.subject}</span>
              <span style="font-size:12px; color:var(--text-muted);">👨‍🏫 ${t.teacher}</span>
            </div>
            <h4 class="task-title" style="font-size:15px; font-weight:700; margin:6px 0 2px 0;">${t.title}</h4>
            <p style="font-size:13px; color:#475569;">${t.desc}</p>
          </div>
          <span style="font-size:11px; font-weight:700; color:var(--danger);">${t.due}</span>
        </div>
        ${t.boardImg ? `<div style="margin:10px 0;"><img src="${t.boardImg}" style="width:100%; max-height:120px; object-fit:cover; border-radius:8px;" /></div>` : ''}
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <div>
            ${t.status === 'completed' ? '<span class="pill pill-success">✓ Completed</span>' : t.status === 'in-progress' ? '<span class="pill pill-warning">⏳ In Progress</span>' : '<span class="pill pill-danger">Not Started</span>'}
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="toggleTaskStatus('${t.id}', 'in-progress')">Mark In Progress</button>
            <button class="btn btn-primary btn-sm" onclick="toggleTaskStatus('${t.id}', 'completed')">
              ${t.status === 'completed' ? 'Re-open' : '✓ Mark Done'}
            </button>
          </div>
        </div>
      </div>
    `).join('');

    main.innerHTML = `
      <!-- Child Switcher Tabs -->
      <div class="child-tabs-bar">
        <button class="child-tab-pill ${state.activeChild==='thabo'?'active':''}" onclick="setChild('thabo')">
          <span>👦 Thabo (Gr 9B • Hoërskool)</span>
          <span class="pill pill-warning">${state.children.thabo.tasks.filter(x=>x.status!=='completed').length} Pending</span>
        </button>
        <button class="child-tab-pill ${state.activeChild==='lerato'?'active':''}" onclick="setChild('lerato')">
          <span>👧 Lerato (Gr 4A • Laerskool)</span>
          <span class="pill pill-success">All Done</span>
        </button>
      </div>

      <div class="layout-2col">
        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h2 style="font-size:17px; font-weight:700;">${child.name}'s Homework Diary</h2>
            <button class="btn btn-outline btn-sm" onclick="showToast('Summary copied to WhatsApp!')">📲 WhatsApp Summary</button>
          </div>
          ${taskCardsHtml}
        </div>

        <div>
          <!-- Mini Challenge Widget -->
          <div class="challenge-card">
            <span class="pill" style="background:rgba(255,255,255,0.2); color:#fff; margin-bottom:6px;">⚡ DAILY BRAINTEASER</span>
            <h4 style="font-size:14px; font-weight:700;">Wiskunde Vinnige Vragie:</h4>
            <p style="font-size:12px; opacity:0.9; margin:4px 0 10px 0;">Wat is 15 × 6 − 18?</p>
            <button class="btn btn-sm" style="background:#fff; color:var(--primary);" onclick="alert('Antwoord is 72! Lekker gewerk!')">Toets Jou Antwoord</button>
          </div>

          <!-- Quick Newsletter Highlight -->
          <div class="card" style="border-left:4px solid var(--primary);">
            <span class="pill pill-primary">LATEST NEWSLETTER</span>
            <h4 style="font-size:13px; font-weight:700; margin:6px 0 4px 0;">${state.news.title}</h4>
            <ul style="font-size:12px; color:#334155; margin-left:16px;">
              ${state.news.bullets.map(b=>`<li>${b}</li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    `;
  }

  function renderStudentDiary(main) {
    state.activeChild = 'thabo';
    renderParentDiary(main);
  }

  function renderEventsView(main) {
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <h2 style="font-size:17px; font-weight:700;">School Events, Sokkies & Exam Calendar</h2>
          <p style="font-size:12px; color:var(--text-muted);">View upcoming events and grade participation eligibility.</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="showToast('📅 Calendar (.ics) synced to your phone!')">📅 Sync to Phone Calendar</button>
      </div>

      <div style="display:grid; grid-template-columns:1fr; gap:10px;">
        ${state.events.map(e => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <span class="pill ${e.type==='sport'?'pill-danger':e.type==='social'?'pill-warning':'pill-primary'}">${e.type.toUpperCase()}</span>
              <h4 style="font-size:15px; font-weight:700; margin:4px 0;">${e.title}</h4>
              <p style="font-size:12px; color:var(--text-muted);">📅 <strong>${e.date}</strong> • 🎯 Eligibility: <strong>${e.eligibility}</strong></p>
            </div>
            <button class="btn btn-outline btn-sm" onclick="showToast('Added event to reminders!')">+ Reminder</button>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderNewsView(main) {
    main.innerHTML = `
      <div class="card" style="border-left: 4px solid var(--primary);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <span class="pill pill-primary">OFFICIAL WEEKLY NEWSLETTER</span>
            <h3 style="font-size:16px; font-weight:700; margin:6px 0 2px 0;">${state.news.title}</h3>
            <p style="font-size:12px; color:var(--text-muted);">Published by School Administration</p>
          </div>
          <button class="btn btn-outline btn-sm" onclick="alert('Downloading official 8-page PDF...')">📥 Download Full PDF</button>
        </div>
        <div style="margin-top:14px;">
          <p style="font-size:13px; font-weight:700; color:#1e293b;">⚡ 3 Key Action Highlights for Parents:</p>
          <ul style="font-size:13px; color:#334155; margin-left:18px; margin-top:6px; line-height:1.7;">
            ${state.news.bullets.map(b=>`<li>${b}</li>`).join('')}
          </ul>
        </div>
      </div>
    `;
  }

  function renderChallengeView(main) {
    main.innerHTML = `
      <div class="card" style="max-width:500px; margin:0 auto; text-align:center; padding:30px;">
        <span class="pill pill-warning" style="font-size:14px; padding:6px 14px;">⚡ DAILY STUDENT CHALLENGE</span>
        <h3 style="font-size:18px; margin:14px 0 8px 0;">Vandag se Wiskunde & Afrikaans Breinkraker</h3>
        <p style="font-size:14px; color:#475569; margin-bottom:16px;">"Wat is die meervoud van 'speelding' en wat is 12 × 12?"</p>
        <button class="btn btn-primary" onclick="alert('Korrek! Speelgoed & 144! +10 Punte vir vandag!')">Dien Antwoord In</button>
      </div>
    `;
  }

  // ================= TEACHER DASHBOARD =================
  function renderTeacherDashboard(main) {
    main.innerHTML = `
      <div class="layout-2col">
        <div>
          <!-- 10s Task Creator -->
          <div class="card">
            <h3 style="font-size:15px; font-weight:700; margin-bottom:10px;">⚡ 10-Second Task Post</h3>
            <div class="form-group">
              <label class="form-label">Subject & Class</label>
              <select class="form-input">
                <option>🪵 Gr 9 Woodwork (Mnr. van der Merwe)</option>
                <option>📐 Gr 10 Maths (Mev. Naidoo)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Instructions for Diary</label>
              <textarea id="teachInput" class="form-input" rows="2" placeholder="e.g. Activity 4 sums 1-8. Sharpen chisel."></textarea>
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="publishTeacherTask()">🚀 Post to Class & Parents</button>
          </div>

          <!-- Morning Roll Call -->
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h3 style="font-size:15px; font-weight:700;">Gr 9 Woodwork: Roll Call</h3>
              <span class="pill pill-success">26/30 Submitted</span>
            </div>
            ${state.classes.wood9.students.map(s => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid var(--border);">
                <div>
                  <strong>${s.name}</strong>
                  <div style="font-size:11px; color:var(--text-muted);">${s.status}</div>
                </div>
                <div>
                  ${s.doctorNote ? '<button class="btn btn-outline btn-sm" onclick="alert(\'Viewing Doctor Note: Excused for 2 days.\')">📄 View Doctor Note</button>' : ''}
                  ${!s.absent ? '<button class="btn btn-danger-soft btn-sm" onclick="showToast(\'Alert sent to parents!\')">Flag Not Done</button>' : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="card">
            <h4 style="font-size:13px; font-weight:700; margin-bottom:6px;">📊 Morning Roll Call Stats</h4>
            <p style="font-size:12px; color:#475569; line-height:1.8;">
              👥 Total in Class: <strong>30</strong><br>
              ✅ Completed at Home: <strong>26</strong><br>
              ❌ Incomplete: <strong>3</strong><br>
              🏥 Absent with Doctor Note: <strong>1</strong>
            </p>
          </div>
        </div>
      </div>
    `;
  }

  // ================= ADMIN DASHBOARD =================
  function renderAdminDashboard(main) {
    main.innerHTML = `
      <div class="layout-2col">
        <div>
          <!-- Early Closure Broadcast -->
          <div class="card">
            <span class="pill pill-danger" style="margin-bottom:6px;">⚠️ URGENT BROADCAST</span>
            <h3 style="font-size:15px; font-weight:700; margin-bottom:10px;">Emergency School Closure Notice</h3>
            <div class="form-group">
              <label class="form-label">Alert Message</label>
              <input type="text" id="adminAlertMsg" class="form-input" value="${state.banner.text}" />
            </div>
            <div class="form-group">
              <label class="form-label">Target Grades</label>
              <select class="form-input" id="adminAlertTgt">
                <option>Grades 4–12</option>
                <option>All Grades (Gr R - Gr 12)</option>
                <option>Grade R Only</option>
              </select>
            </div>
            <button class="btn btn-primary" style="width:100%; background:var(--danger);" onclick="updateAdminBanner()">🚨 Broadcast to All Parents</button>
          </div>

          <!-- Weekly Newsletter Publisher -->
          <div class="card">
            <span class="pill pill-primary" style="margin-bottom:6px;">📰 NEWSLETTER PUBLISHER</span>
            <h3 style="font-size:15px; font-weight:700; margin-bottom:10px;">Publish Weekly Highlights</h3>
            <div class="form-group">
              <label class="form-label">Title</label>
              <input type="text" id="adminNewsTitle" class="form-input" value="${state.news.title}" />
            </div>
            <div class="form-group">
              <label class="form-label">3 Action Highlights (For Busy Parents)</label>
              <textarea id="adminNewsBullets" class="form-input" rows="3">${state.news.bullets.join('\n')}</textarea>
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="updateAdminNews()">📤 Publish & Push Alert</button>
          </div>
        </div>

        <div>
          <div class="card">
            <h4 style="font-size:13px; font-weight:700; margin-bottom:6px;">🏫 School Cloud Status</h4>
            <p style="font-size:12px; color:#475569; line-height:1.8;">
              👨‍👩‍👧 Connected Parents: <strong>412</strong><br>
              👨‍🏫 Registered Teachers: <strong>28</strong><br>
              📡 Active Broadcasts: <strong style="color:var(--danger);">1 Early Closure</strong>
            </p>
          </div>
        </div>
      </div>
    `;
  }

  // ================= STATE ACTIONS =================
  function switchPersona(p) {
    state.activePersona = p;
    state.activeTab = p === 'teacher' ? 'teach-post' : p === 'admin' ? 'admin-broadcast' : 'diary';
    save();
    renderAll();
    showToast(`Logged in as ${document.getElementById('personaSelector').selectedOptions[0].text}`);
  }

  function setTab(t) { state.activeTab = t; save(); renderAll(); }
  function setChild(c) { state.activeChild = c; save(); renderAll(); }

  function toggleTaskStatus(taskId, target) {
    const child = state.children[state.activeChild];
    const task = child.tasks.find(x => x.id === taskId);
    if (task) {
      task.status = task.status === target ? 'not-started' : target;
      save();
      renderAll();
      showToast(`Updated status for ${task.subject}!`);
    }
  }

  function publishTeacherTask() {
    const txt = document.getElementById('teachInput').value;
    if (!txt) return alert("Please type instructions!");
    state.children.thabo.tasks.unshift({
      id: 't-' + Date.now(),
      subject: 'Woodwork / Houtwerk',
      teacher: 'Mnr. J. van der Merwe',
      title: 'Workshop Preparation',
      desc: txt,
      due: 'Tomorrow',
      timestamp: Date.now(),
      status: 'not-started',
      boardImg: null
    });
    save();
    showToast("⚡ Posted in 10s! Live on Thabo's diary.");
    document.getElementById('teachInput').value = '';
    renderAll();
  }

  function updateAdminBanner() {
    state.banner.text = document.getElementById('adminAlertMsg').value;
    state.banner.target = document.getElementById('adminAlertTgt').value;
    save();
    renderAll();
    showToast("🚨 Emergency Banner updated for all parents!");
  }

  function updateAdminNews() {
    state.news.title = document.getElementById('adminNewsTitle').value;
    state.news.bullets = document.getElementById('adminNewsBullets').value.split('\n').filter(x => x.trim() !== '');
    save();
    renderAll();
    showToast("📰 Newsletter published to all parent portals!");
  }

  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function submitAbsence() {
    closeModal('absenceModal');
    showToast("🏥 Doctor's note submitted directly to register teacher!");
  }

  function toggleDevice(m) { document.getElementById('appFrame').classList.toggle('mobile-mode', m === 'mobile'); }

  function uploadCrest(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('crestInitials').classList.add('hidden');
        const img = document.getElementById('crestImg');
        img.src = e.target.result;
        img.classList.remove('hidden');
        showToast("School Crest updated!");
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function resetData() {
    localStorage.removeItem('skoolloop_v3');
    state = defaultState;
    save();
    renderAll();
    showToast("Demo data reset to clean factory defaults!");
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3200);
  }
</script>
</body>
</html>
