<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkoolLoop - Enterprise School Cloud</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --surface: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-lg: 0 15px 30px -4px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0; }

    /* App Shell */
    .app-shell {
      width: 100%;
      min-height: 100vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (min-width: 900px) {
      body { padding: 24px; }
      .app-shell {
        max-width: 1240px;
        min-height: 88vh;
        max-height: 92vh;
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
        border: 1px solid #334155;
      }
    }

    /* Viewport */
    .viewport { flex: 1; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; }
    .viewport.with-bottom-nav { padding-bottom: 70px; }
    @media (min-width: 900px) { .viewport.with-bottom-nav { padding-bottom: 0; } }

    /* Header */
    .app-header {
      background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.92)), url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?w=1200') center/cover;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand-box { display: flex; align-items: center; gap: 14px; }
    .crest-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: #fff; border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: var(--primary); font-size: 18px; overflow: hidden;
    }
    .crest-icon img { width: 100%; height: 100%; object-fit: cover; }

    /* Alert Banner */
    .alert-ticker {
      background: linear-gradient(90deg, #dc2626, #b91c1c);
      color: #fff; padding: 10px 20px; font-size: 12px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }

    /* Layout Grids */
    .desktop-grid { display: grid; grid-template-columns: 1fr; flex: 1; }
    @media (min-width: 900px) {
      .desktop-grid { grid-template-columns: 240px 1fr; }
      .desktop-sidebar {
        border-right: 1px solid var(--border);
        background: #fafbfc;
        padding: 20px 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .bottom-nav { display: none !important; }
    }
    @media (max-width: 899px) { .desktop-sidebar { display: none !important; } }

    .main-panel { padding: 24px; overflow-y: auto; }
    .grid-2col { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    @media (max-width: 1060px) { .grid-2col { grid-template-columns: 1fr; } }

    /* Navigation Items */
    .nav-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin: 12px 0 6px 8px; }
    .nav-item-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 600; color: #475569;
      cursor: pointer; margin-bottom: 4px; transition: all 0.15s;
    }
    .nav-item-btn:hover { background: #f1f5f9; color: var(--text); }
    .nav-item-btn.active { background: var(--primary-light); color: var(--primary); }

    /* Cards */
    .card {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    /* Pills & Badges */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .pill-primary { background: var(--primary-light); color: var(--primary); }
    .pill-success { background: var(--success-light); color: var(--success); }
    .pill-danger { background: var(--danger-light); color: var(--danger); }
    .pill-warning { background: var(--warning-light); color: var(--warning); }

    /* Task Item Card */
    .task-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; background: #fff; transition: all 0.2s;
    }

    /* Wizard Steps Bar */
    .wizard-steps {
      display: flex; justify-content: space-between; margin-bottom: 24px; position: relative;
    }
    .step-item {
      flex: 1; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); position: relative;
    }
    .step-item.active { color: var(--primary); }
    .step-circle {
      width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; color: #475569;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 6px auto; font-size: 12px;
    }
    .step-item.active .step-circle { background: var(--primary); color: #fff; }

    /* Native Bottom Navigation Bar (Mobile) */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
      background: #ffffff; border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 100;
    }
    .nav-tab-btn {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: transparent; border: none; font-size: 10px; font-weight: 700;
      color: var(--text-muted); cursor: pointer;
    }
    .nav-tab-btn.active { color: var(--primary); }
    .nav-tab-btn span.icon { font-size: 18px; }

    /* Password Input Wrap */
    .password-wrap { position: relative; width: 100%; }
    .password-wrap input { width: 100%; padding-right: 40px; }
    .toggle-password-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.6;
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; font-size: 13px; font-weight: 600;
      border-radius: 10px; border: 1px solid transparent; cursor: pointer; width: 100%;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; border-color: var(--border); color: #334155; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 11px; width: auto; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: #475569; text-transform: uppercase; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background:#fff; }

    .clean-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .clean-table th { text-align: left; padding: 10px; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .clean-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); }

    /* Toast */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 20px;
      font-size: 12px; box-shadow: var(--shadow-lg); z-index: 1000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-shell" id="appShell">

  <!-- Alert Ticker -->
  <div class="alert-ticker hidden" id="emergencyTicker">
    <span id="tickerText">📢 <strong>Notice:</strong> Early closure today at 12:30.</span>
    <span class="pill" style="background:rgba(255,255,255,0.2); color:#fff;" id="tickerGrade">All</span>
  </div>

  <!-- Header -->
  <header class="app-header hidden" id="appHeader">
    <div class="brand-box">
      <div class="crest-icon" id="headerCrest">
        <span id="headerCrestLetters">SL</span>
        <img id="headerCrestImg" class="hidden" src="" alt="Crest" />
      </div>
      <div>
        <h1 style="font-size:16px; font-weight:700;" id="headerSchoolName">SkoolLoop Cloud</h1>
        <p style="font-size:11px; opacity:0.85;" id="headerUserName">Welcome</p>
      </div>
    </div>
    <div>
      <button class="btn btn-outline btn-sm" style="background:rgba(255,255,255,0.15); color:#fff; border:none;" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <!-- Viewport -->
  <div class="viewport" id="mainViewport"></div>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav hidden" id="bottomNav"></nav>

</div>

<div id="toast" class="toast hidden"></div>

<script>
  const DB_KEY = 'skoolloop_wizard_v3';
  let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    schools: {},
    users: [],
    homework: [],
    newsletters: [],
    currentUser: null
  };

  function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

  let activeTab = 'diary';
  let activeParentChildIdx = 0;
  let wizardStep = 1;

  window.onload = function() { router(); };

  function router() {
    const user = db.currentUser;
    const header = document.getElementById('appHeader');
    const bNav = document.getElementById('bottomNav');
    const ticker = document.getElementById('emergencyTicker');
    const vp = document.getElementById('mainViewport');

    if (!user) {
      header.classList.add('hidden');
      bNav.classList.add('hidden');
      ticker.classList.add('hidden');
      renderAuthScreen(vp);
    } else {
      const school = db.schools[user.schoolCode] || { name: "SkoolLoop School", isSetupComplete: true, classes: [] };

      // If School Admin hasn't finished initial Setup Wizard
      if (user.role === 'school_admin' && !school.isSetupComplete) {
        header.classList.add('hidden');
        bNav.classList.add('hidden');
        ticker.classList.add('hidden');
        renderSchoolSetupWizard(school, vp);
        return;
      }

      header.classList.remove('hidden');
      bNav.classList.remove('hidden');
      vp.classList.add('with-bottom-nav');

      document.getElementById('headerSchoolName').innerText = school.name;
      document.getElementById('headerUserName').innerText = `${user.name} (${user.role.toUpperCase()})`;

      if (school.logo) {
        document.getElementById('headerCrestLetters').classList.add('hidden');
        const img = document.getElementById('headerCrestImg');
        img.src = school.logo;
        img.classList.remove('hidden');
      } else {
        document.getElementById('headerCrestLetters').innerText = school.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
      }

      if (school.emergencyBanner && school.emergencyBanner.active) {
        ticker.classList.remove('hidden');
        document.getElementById('tickerText').innerHTML = `📢 <strong>Notice:</strong> ${school.emergencyBanner.text}`;
        document.getElementById('tickerGrade').innerText = school.emergencyBanner.target;
      } else {
        ticker.classList.add('hidden');
      }

      renderAppLayout(user, vp);
    }
  }

  // ================= 1. AUTHENTICATION & REGISTRATION =================
  function renderAuthScreen(vp) {
    vp.innerHTML = `
      <div style="padding: 32px 20px; max-width: 520px; width: 100%; margin: auto;">
        <div style="text-align:center; margin-bottom: 24px;">
          <div style="width:64px; height:64px; border-radius:18px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; margin: 0 auto 12px auto; box-shadow: 0 10px 20px rgba(67,56,202,0.3);">
            SL
          </div>
          <h2 style="font-size:22px; font-weight:800; color:#0f172a;">SkoolLoop Cloud</h2>
          <p style="font-size:13px; color:var(--text-muted); margin-top:2px;">Digital Homework Diary & School Cloud</p>
        </div>

        <div style="display:flex; background:#e2e8f0; border-radius:10px; padding:3px; margin-bottom:20px;">
          <button id="btnTabLogin" class="btn btn-sm" style="flex:1; background:#fff; color:var(--text);" onclick="toggleAuthMode('login')">Sign In</button>
          <button id="btnTabRegister" class="btn btn-sm" style="flex:1; background:transparent; color:var(--text-muted);" onclick="toggleAuthMode('register')">New Registration</button>
        </div>

        <!-- Login Form -->
        <div id="loginSection">
          <div class="card" style="margin:0 0 14px 0;">
            <div class="form-group">
              <label class="form-label">Email / Phone / Student ID</label>
              <input type="text" id="loginId" class="form-input" placeholder="e.g. admin@kuvuki.co.za or parent@gmail.com" />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="password-wrap">
                <input type="password" id="loginPass" class="form-input" placeholder="••••••••" />
                <button type="button" class="toggle-password-btn" onclick="togglePass('loginPass', this)">👁️</button>
              </div>
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Sign In to Portal</button>
          </div>
        </div>

        <!-- Registration Form -->
        <div id="registerSection" class="hidden">
          <div class="form-group">
            <label class="form-label">Who is Registering?</label>
            <select class="form-input" id="regRoleSelect" onchange="switchRegForm(this.value)">
              <option value="school">🏫 Register a New School (Step-by-Step Setup)</option>
              <option value="parent">👨‍👩‍👧 Register as a Parent (Grades R to 12 & New Students)</option>
              <option value="teacher">👨‍🏫 Register as a Teacher</option>
              <option value="student">🎓 Register as a High School Student (Gr 8–12)</option>
            </select>
          </div>
          <div id="dynamicRegFields"></div>
        </div>
      </div>
    `;
    switchRegForm('school');
  }

  function toggleAuthMode(mode) {
    document.getElementById('loginSection').classList.toggle('hidden', mode !== 'login');
    document.getElementById('registerSection').classList.toggle('hidden', mode !== 'register');
    document.getElementById('btnTabLogin').style.background = mode === 'login' ? '#fff' : 'transparent';
    document.getElementById('btnTabLogin').style.color = mode === 'login' ? 'var(--text)' : 'var(--text-muted)';
    document.getElementById('btnTabRegister').style.background = mode === 'register' ? '#fff' : 'transparent';
    document.getElementById('btnTabRegister').style.color = mode === 'register' ? 'var(--text)' : 'var(--text-muted)';
  }

  function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerText = '🔒';
    } else {
      input.type = 'password';
      btn.innerText = '👁️';
    }
  }

  function switchRegForm(role) {
    const c = document.getElementById('dynamicRegFields');
    if (role === 'school') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">🏫 Step 1: Initial School Details</h4>
          <div class="form-group">
            <label class="form-label">School Official Name</label>
            <input type="text" id="rSchoolName" class="form-input" placeholder="e.g. Privaat Skool Kuvukiland" />
          </div>
          <div class="form-group">
            <label class="form-label">School Type</label>
            <select class="form-input" id="rSchoolType">
              <option value="combined">Combined School (Gr R – 12)</option>
              <option value="primary">Primary School (Gr R – 7)</option>
              <option value="high">High School (Gr 8 – 12)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Create Unique School Code</label>
            <input type="text" id="rSchoolCode" class="form-input" placeholder="e.g. KUV-000" />
          </div>
          <div class="form-group">
            <label class="form-label">Set Staff Master PIN</label>
            <div class="password-wrap">
              <input type="password" id="rSchoolPin" class="form-input" placeholder="e.g. STAFF2026" />
              <button type="button" class="toggle-password-btn" onclick="togglePass('rSchoolPin', this)">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Admin Email & Password</label>
            <input type="email" id="rAdminEmail" class="form-input" placeholder="admin@kuvuki.co.za" style="margin-bottom:6px;" />
            <div class="password-wrap">
              <input type="password" id="rAdminPass" class="form-input" placeholder="Create Admin Password" />
              <button type="button" class="toggle-password-btn" onclick="togglePass('rAdminPass', this)">👁️</button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="submitRegSchool()">Start Setup Wizard ➔</button>
        </div>
      `;
    } else if (role === 'parent') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:8px; color:var(--primary);">👨‍👩‍👧 Parent Sign-Up (New & Existing Students)</h4>
          <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Parents register for all Primary School children (Gr R–7) and High Schoolers.</p>
          <div class="form-group">
            <label class="form-label">Parent Full Name & Phone</label>
            <input type="text" id="rParentName" class="form-input" placeholder="e.g. Mrs. Sarah Mokoena" style="margin-bottom:6px;" />
            <input type="tel" id="rParentPhone" class="form-input" placeholder="e.g. 082 123 4567" />
          </div>
          <div class="form-group">
            <label class="form-label">School Code</label>
            <input type="text" id="rParentSchoolCode" class="form-input" placeholder="e.g. KUV-000" />
          </div>
          <div class="form-group">
            <label class="form-label">Child Full Name & Grade</label>
            <input type="text" id="rChildName" class="form-input" placeholder="e.g. Thabo Mokoena" style="margin-bottom:6px;" />
            <select class="form-input" id="rChildGrade" style="margin-bottom:6px;">
              <option>Grade R</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
              <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option>
              <option selected>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
            </select>
            <input type="text" id="rChildClassCodes" class="form-input" placeholder="Class Codes given by school (e.g. KUV-WOOD9, KUV-GR4A)" />
          </div>
          <div class="form-group">
            <label class="form-label">Email & Password</label>
            <input type="email" id="rParentEmail" class="form-input" placeholder="parent@gmail.com" style="margin-bottom:6px;" />
            <div class="password-wrap">
              <input type="password" id="rParentPass" class="form-input" placeholder="Create Password" />
              <button type="button" class="toggle-password-btn" onclick="togglePass('rParentPass', this)">👁️</button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="submitRegParent()">Register Parent Account</button>
        </div>
      `;
    } else if (role === 'teacher') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">👨‍🏫 Teacher Sign-Up</h4>
          <div class="form-group">
            <label class="form-label">School Code & Staff Master PIN</label>
            <input type="text" id="rTeacherSchoolCode" class="form-input" placeholder="e.g. KUV-000" style="margin-bottom:6px;" />
            <div class="password-wrap">
              <input type="password" id="rTeacherPin" class="form-input" placeholder="Staff PIN from school" />
              <button type="button" class="toggle-password-btn" onclick="togglePass('rTeacherPin', this)">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Title & Full Name</label>
            <input type="text" id="rTeacherName" class="form-input" placeholder="e.g. Mnr. J. van der Merwe" />
          </div>
          <div class="form-group">
            <label class="form-label">Subject & Assigned Class Code</label>
            <input type="text" id="rTeacherSubject" class="form-input" placeholder="e.g. Woodwork / Houtwerk" style="margin-bottom:6px;" />
            <input type="text" id="rTeacherClassCode" class="form-input" placeholder="e.g. KUV-WOOD9" />
          </div>
          <div class="form-group">
            <label class="form-label">Email & Password</label>
            <input type="email" id="rTeacherEmail" class="form-input" placeholder="teacher@school.co.za" style="margin-bottom:6px;" />
            <div class="password-wrap">
              <input type="password" id="rTeacherPass" class="form-input" placeholder="Create Password" />
              <button type="button" class="toggle-password-btn" onclick="togglePass('rTeacherPass', this)">👁️</button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="submitRegTeacher()">Create Teacher Account</button>
        </div>
      `;
    } else if (role === 'student') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:8px; color:var(--primary);">🎓 High School Student Sign-Up (Grades 8–12)</h4>
          <div class="form-group">
            <label class="form-label">School Code & Student ID</label>
            <input type="text" id="rStudentSchoolCode" class="form-input" placeholder="e.g. KUV-000" style="margin-bottom:6px;" />
            <input type="text" id="rStudentID" class="form-input" placeholder="Student Admission Number (e.g. STU902)" />
          </div>
          <div class="form-group">
            <label class="form-label">Full Name & Class Codes</label>
            <input type="text" id="rStudentName" class="form-input" placeholder="Your Full Name" style="margin-bottom:6px;" />
            <input type="text" id="rStudentClassCodes" class="form-input" placeholder="e.g. KUV-WOOD9, KUV-MATH9" />
          </div>
          <div class="form-group">
            <label class="form-label">Email / User & Password</label>
            <input type="text" id="rStudentUser" class="form-input" placeholder="email or username" style="margin-bottom:6px;" />
            <div class="password-wrap">
              <input type="password" id="rStudentPass" class="form-input" placeholder="Create Password" />
              <button type="button" class="toggle-password-btn" onclick="togglePass('rStudentPass', this)">👁️</button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="submitRegStudent()">Create Student Diary</button>
        </div>

  function handleWizardCrest(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        db.schools[db.currentUser.schoolCode].logo = e.target.result;
        saveDB();
        document.getElementById('wizardCrestPreview').innerHTML = `<img src="${e.target.result}" />`;
        showToast("Crest uploaded!");
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function addWizardClass() {
    const title = document.getElementById('wizClassTitle').value.trim();
    let code = document.getElementById('wizClassCode').value.trim().toUpperCase();
    if (!title) return alert("Please enter a class title!");
    if (!code) code = db.currentUser.schoolCode + "-" + title.substring(0,4).toUpperCase();

    const school = db.schools[db.currentUser.schoolCode];
    school.classes.push({ title: title, code: code, teacher: "Unassigned" });
    saveDB();
    showToast(`Added ${title}!`);
    router();
  }

  function finishSchoolSetup() {
    db.schools[db.currentUser.schoolCode].isSetupComplete = true;
    saveDB();
    showToast("🎉 School Setup complete! Welcome to your dashboard.");
    wizardStep = 1;
    router();
  }

  // ================= 3. REGISTRATION SUBMIT LOGIC =================
  function submitRegSchool() {
    const name = document.getElementById('rSchoolName').value.trim();
    const type = document.getElementById('rSchoolType').value;
    const code = document.getElementById('rSchoolCode').value.trim().toUpperCase();
    const pin = document.getElementById('rSchoolPin').value.trim();
    const email = document.getElementById('rAdminEmail').value.trim();
    const pass = document.getElementById('rAdminPass').value.trim();

    if (!name || !code || !pin || !email || !pass) return alert("Please fill all school fields!");

    db.schools[code] = {
      name: name,
      code: code,
      type: type,
      pin: pin,
      logo: null,
      isSetupComplete: false, // Triggers Guided Wizard
      classes: [
        { code: code + "-GR1", title: "Graad 1 Klaswerk", teacher: "Unassigned" },
        { code: code + "-WOOD9", title: "Graad 9 Woodwork", teacher: "Unassigned" }
      ],
      emergencyBanner: { active: false, text: "", target: "" }
    };

    const user = {
      id: 'adm_' + Date.now(),
      role: 'school_admin',
      name: 'Principal (' + name + ')',
      email: email,
      pass: pass,
      schoolCode: code
    };

    db.users.push(user);
    db.currentUser = user;
    saveDB();
    showToast(`School '${name}' created! Please finish the 3-step setup.`);
    router();
  }

  function submitRegParent() {
    const name = document.getElementById('rParentName').value.trim();
    const phone = document.getElementById('rParentPhone').value.trim();
    const sCode = document.getElementById('rParentSchoolCode').value.trim().toUpperCase();
    const childName = document.getElementById('rChildName').value.trim();
    const grade = document.getElementById('rChildGrade').value;
    const cCodes = document.getElementById('rChildClassCodes').value.trim().toUpperCase().split(',').map(x=>x.trim()).filter(Boolean);
    const email = document.getElementById('rParentEmail').value.trim();
    const pass = document.getElementById('rParentPass').value.trim();

    if (!name || !sCode || !childName || !email || !pass) return alert("Please fill in all parent fields!");

    const user = {
      id: 'par_' + Date.now(),
      role: 'parent',
      name: name,
      phone: phone,
      email: email,
      pass: pass,
      schoolCode: sCode,
      children: [{ id: 'ch_' + Date.now(), name: childName, grade: grade, classCodes: cCodes }]
    };

    db.users.push(user);
    db.currentUser = user;
    saveDB();
    showToast(`Parent account created for ${name}!`);
    router();
  }

  function submitRegTeacher() {
    const sCode = document.getElementById('rTeacherSchoolCode').value.trim().toUpperCase();
    const pin = document.getElementById('rTeacherPin').value.trim();
    const name = document.getElementById('rTeacherName').value.trim();
    const subj = document.getElementById('rTeacherSubject').value.trim();
    const cCode = document.getElementById('rTeacherClassCode').value.trim().toUpperCase();
    const email = document.getElementById('rTeacherEmail').value.trim();
    const pass = document.getElementById('rTeacherPass').value.trim();

    const school = db.schools[sCode];
    if (!school) return alert(`School Code '${sCode}' not found!`);
    if (school.pin !== pin) return alert("Invalid Staff Master PIN!");

    const user = {
      id: 'tch_' + Date.now(),
      role: 'teacher',
      name: name,
      email: email,
      pass: pass,
      schoolCode: sCode,
      subject: subj,
      classCode: cCode
    };

    if (!school.classes.some(c => c.code === cCode)) {
      school.classes.push({ code: cCode, title: subj, teacher: name });
    }

    db.users.push(user);
    db.currentUser = user;
    saveDB();
    showToast(`Teacher account active for ${name}!`);
    router();
  }

  function submitRegStudent() {
    const sCode = document.getElementById('rStudentSchoolCode').value.trim().toUpperCase();
    const stuId = document.getElementById('rStudentID').value.trim();
    const name = document.getElementById('rStudentName').value.trim();
    const cCodes = document.getElementById('rStudentClassCodes').value.trim().toUpperCase().split(',').map(x=>x.trim()).filter(Boolean);
    const userAcc = document.getElementById('rStudentUser').value.trim();
    const pass = document.getElementById('rStudentPass').value.trim();

    if (!name || !sCode || !stuId || !userAcc || !pass) return alert("Please fill all student fields!");

    const user = {
      id: stuId,
      role: 'student',
      name: name,
      email: userAcc,
      pass: pass,
      schoolCode: sCode,
      classCodes: cCodes
    };

    db.users.push(user);
    db.currentUser = user;
    saveDB();
    showToast(`Welcome ${name}! Student diary ready.`);
    router();
  }

  function handleLogin() {
    const id = document.getElementById('loginId').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const user = db.users.find(u => (u.email === id || u.id === id) && u.pass === pass);

    if (user) {
      db.currentUser = user;
      saveDB();
      showToast(`Welcome back, ${user.name}!`);
      router();
    } else {
      alert("Invalid login details. Check your email/password or create a new registration.");
    }
  }

  function logout() {
    db.currentUser = null;
    saveDB();
    showToast("Signed out safely.");
    router();
  }

                <div style="font-size:11px; color:var(--success);">Aggregate: 78% • Passed with Distinction</div>
              </div>
              <button class="btn btn-primary btn-sm" onclick="alert('Downloading official signed PDF for ${child.name}...')">📥 PDF</button>
            </div>
          </div>
        `;
      } else if (activeTab === 'absence') {
        panel.innerHTML = `
          <div class="card">
            <h3 style="font-size:15px; font-weight:700; margin-bottom:10px;">🏥 Submit Doctor's Note for ${child.name}</h3>
            <div class="form-group">
              <label class="form-label">Reason</label>
              <select class="form-input">
                <option>Illness (Doctor visited / Doktersbrief attached)</option>
                <option>Family Emergency</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">📸 Photo of Medical Certificate</label>
              <input type="file" accept="image/*" capture="environment" class="form-input" />
            </div>
            <button class="btn btn-primary" onclick="showToast('Doctor note submitted to register teacher!')">Send Note to Teacher</button>
          </div>
        `;
      } else if (activeTab === 'news') {
        panel.innerHTML = `
          <div class="card" style="border-left:4px solid var(--primary);">
            <span class="pill pill-primary">OFFICIAL WEEKLY NEWSLETTER</span>
            <h3 style="font-size:15px; font-weight:700; margin:6px 0 4px 0;">Nuusbrief #28 • Term 3</h3>
            <ul style="font-size:12px; color:#334155; margin-left:16px; margin-top:6px; line-height:1.6;">
              <li>Friday is Civvies Day (R10 donation).</li>
              <li>Rugby vs Nelspruit starts at 14:00.</li>
              <li>School fees due by 30 September.</li>
            </ul>
          </div>
        `;
      }
    }

    // STUDENT
    else if (user.role === 'student') {
      const tasks = db.homework.filter(h => user.classCodes && user.classCodes.includes(h.classCode));
      if (activeTab === 'diary') {
        panel.innerHTML = `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <h3 style="font-size:16px; font-weight:700;">My Homework Tasks</h3>
              <button class="btn btn-outline btn-sm" onclick="promptStudentAddClassCode()">+ Join New Class Code</button>
            </div>
            ${tasks.length === 0 ? '<p style="font-size:12px; color:var(--text-muted);">No tasks assigned for your class codes yet.</p>' : ''}
            ${tasks.map(t => `
              <div class="task-card">
                <span class="pill pill-primary">${t.subject}</span>
                <span style="font-size:11px; color:var(--text-muted); margin-left:4px;">👨‍🏫 ${t.teacherName}</span>
                <h4 style="font-size:14px; margin:6px 0 2px 0;">${t.title}</h4>
                <p style="font-size:12px; color:#475569;">${t.desc}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (activeTab === 'quiz') {
        panel.innerHTML = `
          <div class="card" style="background:linear-gradient(135deg, #4338ca, #6366f1); color:#fff;">
            <span class="pill" style="background:rgba(255,255,255,0.2); color:#fff; margin-bottom:8px;">⚡ DAILY 3-QUESTION CHALLENGE</span>
            <h3 style="font-size:16px; font-weight:700;">Maths & Language Breinkraker</h3>
            <p style="font-size:14px; font-weight:700; margin:10px 0;">Q1: What is 15 × 6 − 18?</p>
            <button class="btn btn-outline btn-sm" style="background:#fff; color:var(--primary); margin-bottom:6px;" onclick="alert('Correct! 72! +10 Points')">A) 72</button>
            <button class="btn btn-outline btn-sm" style="background:#fff; color:var(--primary);" onclick="alert('Try again!')">B) 64</button>
          </div>
        `;
      }
    }
  }

  // Helper Actions (Mid-Year Add Class Code)
  function promptParentAddClassCode() {
    const code = prompt("Enter new Class Code given by school (e.g. KUV-WOOD9 or KUV-GR4A):");
    if (!code) return;
    const child = db.currentUser.children[activeParentChildIdx];
    if (!child.classCodes.includes(code.toUpperCase())) {
      child.classCodes.push(code.toUpperCase());
      saveDB();
      showToast(`Linked ${child.name} to class ${code.toUpperCase()}!`);
      router();
    }
  }

  function promptStudentAddClassCode() {
    const code = prompt("Enter new Class Code given by your teacher (e.g. KUV-WOOD9):");
    if (!code) return;
    if (!db.currentUser.classCodes.includes(code.toUpperCase())) {
      db.currentUser.classCodes.push(code.toUpperCase());
      saveDB();
      showToast(`Joined class ${code.toUpperCase()}!`);
      router();
    }
  }

  function promptAddClass() {
    const title = prompt("Enter Class / Subject Name (e.g. Gr 9 Woodwork or Gr 4A Klaswerk):");
    const code = prompt("Enter Unique Class Code (e.g. KUV-WOOD9):");
    const teacher = prompt("Enter Teacher Name (e.g. Mnr. J. van der Merwe):");
    if (!title || !code) return;

    const school = db.schools[db.currentUser.schoolCode];
    school.classes.push({ code: code.toUpperCase(), title: title, teacher: teacher || "Unassigned" });
    saveDB();
    showToast(`Added ${title} (${code})!`);
    router();
  }

  function saveEmergencyBanner() {
    const text = document.getElementById('admBroadcastText').value.trim();
    const target = document.getElementById('admBroadcastTarget').value;
    const school = db.schools[db.currentUser.schoolCode];
    school.emergencyBanner = { active: true, text: text, target: target };
    saveDB();
    showToast("🚨 Emergency banner broadcasted!");
    router();
  }

  function saveNewsletter() {
    const title = document.getElementById('admNewsTitle').value.trim();
    const bullets = document.getElementById('admNewsBullets').value.split('\n').filter(Boolean);
    if (!title) return alert("Please enter title!");
    db.newsletters.unshift({ schoolCode: db.currentUser.schoolCode, title: title, bullets: bullets });
    saveDB();
    showToast("📰 Newsletter published!");
    setNavTab('admin-classes');
  }

  function postHomeworkTeacher() {
    const title = document.getElementById('tHwTitle').value.trim();
    const desc = document.getElementById('tHwDesc').value.trim();
    if (!title) return alert("Please enter homework title!");

    db.homework.unshift({
      id: 'hw_' + Date.now(),
      schoolCode: db.currentUser.schoolCode,
      classCode: db.currentUser.classCode,
      subject: db.currentUser.subject,
      teacherName: db.currentUser.name,
      title: title,
      desc: desc,
      due: "Tomorrow"
    });
    saveDB();
    showToast("⚡ Homework posted to class & parents!");
    setNavTab('post');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3200);
  }
</script>
</body>
</html>
