<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkoolLoop - School Cloud</title>
  <style>
    :root {
      --primary: #4338ca;
      --primary-hover: #3730a3;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --surface: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 14px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-lg: 0 15px 30px -4px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0; }

    /* App Shell */
    .app-shell {
      width: 100%;
      max-width: 440px; /* Native Mobile Default */
      height: 100vh;
      max-height: 920px;
      background: var(--surface);
      border-radius: 0;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (min-width: 860px) {
      body { padding: 20px; }
      .app-shell { border-radius: 24px; border: 1px solid #334155; height: 90vh; }
      .app-shell.desktop-wide { max-width: 1200px; }
    }

    /* Screen Viewport */
    .viewport { flex: 1; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; padding-bottom: 70px; }
    .viewport.no-bottom-nav { padding-bottom: 20px; }

    /* Custom Header with Campus Photo */
    .app-header {
      background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?w=1200') center/cover;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand-box { display: flex; align-items: center; gap: 12px; }
    .crest-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: #fff; border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: var(--primary); font-size: 16px; overflow: hidden;
    }
    .crest-icon img { width: 100%; height: 100%; object-fit: cover; }

    /* Emergency Alert Bar */
    .alert-ticker {
      background: linear-gradient(90deg, #dc2626, #b91c1c);
      color: #fff; padding: 8px 16px; font-size: 12px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }

    /* Cards */
    .card {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin: 12px 16px;
      box-shadow: var(--shadow);
    }

    /* Pills & Badges */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .pill-primary { background: var(--primary-light); color: var(--primary); }
    .pill-success { background: var(--success-light); color: var(--success); }
    .pill-danger { background: var(--danger-light); color: var(--danger); }
    .pill-warning { background: var(--warning-light); color: var(--warning); }

    /* Task Item Card */
    .task-card {
      border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 10px; background: #fff; transition: all 0.2s;
    }
    .task-card.in-progress { border-color: #fde68a; background: #fffdf5; }
    .task-card.completed { border-color: #a7f3d0; background: #f0fdf4; opacity: 0.85; }
    .task-card.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

    /* Native Bottom Navigation Bar (Mobile) */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 62px;
      background: #ffffff; border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 100;
    }
    .nav-tab-btn {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      background: transparent; border: none; font-size: 10px; font-weight: 700;
      color: var(--text-muted); cursor: pointer;
    }
    .nav-tab-btn.active { color: var(--primary); }
    .nav-tab-btn span.icon { font-size: 18px; }

    /* Buttons & Form Elements */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px; font-size: 13px; font-weight: 600;
      border-radius: 10px; border: 1px solid transparent; cursor: pointer; width: 100%;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; border-color: var(--border); color: #334155; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 11px; width: auto; }

    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; color: #475569; text-transform: uppercase; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background:#fff; }

    /* Modals & Toast */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999;
    }
    .modal-card { background: #fff; border-radius: 16px; max-width: 440px; width: 100%; overflow: hidden; max-height: 90vh; overflow-y: auto; }
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 20px;
      font-size: 12px; box-shadow: var(--shadow-lg); z-index: 1000;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-shell" id="appShell">

  <!-- Top Emergency Ticker (Controlled by School Admin) -->
  <div class="alert-ticker hidden" id="emergencyTicker">
    <span id="tickerText">📢 <strong>Notice:</strong> Early closure today at 12:30.</span>
    <span class="pill" style="background:rgba(255,255,255,0.2); color:#fff;" id="tickerGrade">All</span>
  </div>

  <!-- Dynamic Header -->
  <header class="app-header hidden" id="appHeader">
    <div class="brand-box">
      <div class="crest-icon" id="headerCrest">
        <span id="headerCrestLetters">SL</span>
        <img id="headerCrestImg" class="hidden" src="" alt="Crest" />
      </div>
      <div>
        <h1 style="font-size:15px; font-weight:700;" id="headerSchoolName">SkoolLoop Cloud</h1>
        <p style="font-size:11px; opacity:0.85;" id="headerUserName">Welcome</p>
      </div>
    </div>
    <div>
      <button class="btn btn-outline btn-sm" style="background:rgba(255,255,255,0.15); color:#fff; border:none;" onclick="logout()">Log Out</button>
    </div>
  </header>

  <!-- Main Viewport Screen -->
  <main class="viewport no-bottom-nav" id="mainViewport">
    <!-- Rendered dynamically by state router -->
  </main>

  <!-- Native Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav hidden" id="bottomNav">
    <!-- Populated dynamically based on user role -->
  </nav>

</div>

<div id="toast" class="toast hidden"></div>

<script>
  // Complete Multi-Tenant Database Engine (LocalStorage)
  const DB_KEY = 'skoolloop_clean_production_v1';
  let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    schools: {},
    users: [], // { id, role: 'school_admin'|'teacher'|'parent'|'student', name, email, schoolCode, ... }
    homework: [],
    events: [],
    newsletters: [],
    absences: [],
    reports: [],
    currentUser: null
  };

  function saveDB() {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }

  window.onload = function() {
    router();
  };

  // Main App Router
  function router() {
    const user = db.currentUser;
    const header = document.getElementById('appHeader');
    const bNav = document.getElementById('bottomNav');
    const ticker = document.getElementById('emergencyTicker');
    const vp = document.getElementById('mainViewport');

    if (!user) {
      header.classList.add('hidden');
      bNav.classList.add('hidden');
      ticker.classList.add('hidden');
      vp.classList.add('no-bottom-nav');
      renderAuthScreen(vp);
    } else {
      header.classList.remove('hidden');
      bNav.classList.remove('hidden');
      vp.classList.remove('no-bottom-nav');
      
      const school = db.schools[user.schoolCode] || { name: "SkoolLoop School", logo: null, banner: null };
      document.getElementById('headerSchoolName').innerText = school.name;
      document.getElementById('headerUserName').innerText = `${user.name} (${user.role.toUpperCase()})`;
      
      if (school.logo) {
        document.getElementById('headerCrestLetters').classList.add('hidden');
        const img = document.getElementById('headerCrestImg');
        img.src = school.logo;
        img.classList.remove('hidden');
      } else {
        document.getElementById('headerCrestLetters').innerText = school.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
      }

      if (school.emergencyBanner && school.emergencyBanner.active) {
        ticker.classList.remove('hidden');
        document.getElementById('tickerText').innerHTML = `📢 <strong>Notice:</strong> ${school.emergencyBanner.text}`;
        document.getElementById('tickerGrade').innerText = school.emergencyBanner.target;
      } else {
        ticker.classList.add('hidden');
      }

      renderBottomNav(user.role);
      renderRoleDashboard(user, vp);
    }
  }

  // ================= 1. AUTHENTICATION & ONBOARDING SCREENS =================
  function renderAuthScreen(vp) {
    vp.innerHTML = `
      <div style="padding: 24px 16px; text-align:center;">
        <div style="width:60px; height:60px; border-radius:16px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; margin: 0 auto 12px auto;">
          SL
        </div>
        <h2 style="font-size:20px; font-weight:800; color:#0f172a;">SkoolLoop Cloud</h2>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:20px;">Digital Homework Diary & School Portal</p>

        <!-- Auth Switch Tabs -->
        <div style="display:flex; background:#e2e8f0; border-radius:10px; padding:3px; margin-bottom:18px;">
          <button id="btnTabLogin" class="btn btn-sm" style="flex:1; background:#fff; color:var(--text);" onclick="showAuthTab('login')">Sign In</button>
          <button id="btnTabRegister" class="btn btn-sm" style="flex:1; background:transparent; color:var(--text-muted);" onclick="showAuthTab('register')">New Registration</button>
        </div>

        <!-- Login Form -->
        <div id="loginFormSection">
          <div class="card" style="margin:0 0 14px 0; text-align:left;">
            <div class="form-group">
              <label class="form-label">Email / Phone / Student ID</label>
              <input type="text" id="loginUsername" class="form-input" placeholder="e.g. parent@gmail.com or STU123" />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" />
            </div>
            <button class="btn btn-primary" onclick="performLogin()">Sign In to Portal</button>
          </div>
          <button class="btn btn-outline btn-sm" style="width:100%;" onclick="loadSampleDataAndLogin()">⚡ Quick Load Demo Data</button>
        </div>

        <!-- Role-Based Registration Selector -->
        <div id="registerFormSection" class="hidden" style="text-align:left;">
          <div class="form-group">
            <label class="form-label">Who is Registering?</label>
            <select class="form-input" id="regRoleSelect" onchange="renderSpecificRegForm(this.value)">
              <option value="school">🏫 Register a New School (Principal / Bursar)</option>
              <option value="teacher">👨‍🏫 Register as a Teacher</option>
              <option value="parent">👨‍👩‍👧 Register as a Parent</option>
              <option value="student">🎓 Register as a High School Student (Gr 8–12)</option>
              <option value="staff">💼 Register as School Office / Reception Staff</option>
            </select>
          </div>
          <div id="dynamicRegFormContainer"></div>
        </div>
      </div>
    `;
    renderSpecificRegForm('school');
  }

  function showAuthTab(tab) {
    document.getElementById('loginFormSection').classList.toggle('hidden', tab !== 'login');
    document.getElementById('registerFormSection').classList.toggle('hidden', tab !== 'register');
    document.getElementById('btnTabLogin').style.background = tab === 'login' ? '#fff' : 'transparent';
    document.getElementById('btnTabLogin').style.color = tab === 'login' ? 'var(--text)' : 'var(--text-muted)';
    document.getElementById('btnTabRegister').style.background = tab === 'register' ? '#fff' : 'transparent';
    document.getElementById('btnTabRegister').style.color = tab === 'register' ? 'var(--text)' : 'var(--text-muted)';
  }

  function renderSpecificRegForm(role) {
    const c = document.getElementById('dynamicRegFormContainer');
    
    // 1. School Registration
    if (role === 'school') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">🏫 School Registration</h4>
          <div class="form-group">
            <label class="form-label">School Official Name</label>
            <input type="text" id="regSchoolName" class="form-input" placeholder="e.g. Hoërskool Centurion" />
          </div>
          <div class="form-group">
            <label class="form-label">School Type</label>
            <select class="form-input" id="regSchoolType">
              <option value="high">High School (Hoërskool / Grades 8–12)</option>
              <option value="primary">Primary School (Laerskool / Grades R–7)</option>
              <option value="combined">Combined School (Gr R – 12)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Create Unique School Code</label>
            <input type="text" id="regSchoolCode" class="form-input" placeholder="e.g. HCEN-2026" />
          </div>
          <div class="form-group">
            <label class="form-label">Set Staff & Teacher Master PIN</label>
            <input type="password" id="regSchoolPin" class="form-input" placeholder="e.g. STAFF2026" />
          </div>
          <div class="form-group">
            <label class="form-label">Admin Email & Password</label>
            <input type="email" id="regSchoolAdminEmail" class="form-input" placeholder="admin@school.co.za" style="margin-bottom:6px;" />
            <input type="password" id="regSchoolAdminPass" class="form-input" placeholder="Admin Password" />
          </div>
          <button class="btn btn-primary" onclick="submitSchoolReg()">Create School & Sign In</button>
        </div>
      `;
    } 
    // 2. Teacher Registration
    else if (role === 'teacher') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">👨‍🏫 Teacher Sign-Up</h4>
          <div class="form-group">
            <label class="form-label">School Code</label>
            <input type="text" id="regTeacherSchoolCode" class="form-input" placeholder="Enter school code (e.g. HCEN-2026)" />
          </div>
          <div class="form-group">
            <label class="form-label">School Staff Master PIN</label>
            <input type="password" id="regTeacherPin" class="form-input" placeholder="Enter Staff PIN from school" />
          </div>
          <div class="form-group">
            <label class="form-label">Title & Full Name</label>
            <input type="text" id="regTeacherName" class="form-input" placeholder="e.g. Mnr. J. van der Merwe" />
          </div>
          <div class="form-group">
            <label class="form-label">First Subject & Class</label>
            <input type="text" id="regTeacherSubject" class="form-input" placeholder="e.g. Woodwork / Houtwerk" style="margin-bottom:6px;" />
            <input type="text" id="regTeacherClassCode" class="form-input" placeholder="Class Code (e.g. WOOD-9B)" />
          </div>
          <div class="form-group">
            <label class="form-label">Email & Password</label>
            <input type="email" id="regTeacherEmail" class="form-input" placeholder="teacher@school.co.za" style="margin-bottom:6px;" />
            <input type="password" id="regTeacherPass" class="form-input" placeholder="Create Password" />
          </div>
          <button class="btn btn-primary" onclick="submitTeacherReg()">Register Teacher Account</button>
        </div>
      `;
    }
    // 3. Parent Registration
    else if (role === 'parent') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">👨‍👩‍👧 Parent Sign-Up</h4>
          <div class="form-group">
            <label class="form-label">Parent Full Name & Mobile</label>
            <input type="text" id="regParentName" class="form-input" placeholder="e.g. Mrs. Sarah Mokoena" style="margin-bottom:6px;" />
            <input type="tel" id="regParentPhone" class="form-input" placeholder="e.g. 082 123 4567" />
          </div>
          <div class="form-group">
            <label class="form-label">School Code</label>
            <input type="text" id="regParentSchoolCode" class="form-input" placeholder="Enter child's school code" />
          </div>
          <div class="form-group">
            <label class="form-label">Add First Child</label>
            <input type="text" id="regParentChildName" class="form-input" placeholder="Child Full Name (e.g. Thabo Mokoena)" style="margin-bottom:6px;" />
            <select class="form-input" id="regParentChildGrade" style="margin-bottom:6px;">
              <option>Grade R</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
              <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option>
              <option selected>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option>
            </select>
            <input type="text" id="regParentClassCodes" class="form-input" placeholder="Subject Codes (e.g. WOOD-9B, MATH-9)" />
          </div>
          <div class="form-group">
            <label class="form-label">Email & Password</label>
            <input type="email" id="regParentEmail" class="form-input" placeholder="parent@gmail.com" style="margin-bottom:6px;" />
            <input type="password" id="regParentPass" class="form-input" placeholder="Create Password" />
          </div>
          <button class="btn btn-primary" onclick="submitParentReg()">Register Parent & Children</button>
        </div>
      `;
    }
    // 4. Student Registration (Gr 8–12 Only)
    else if (role === 'student') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">🎓 High School Student Sign-Up</h4>
          <div class="form-group">
            <label class="form-label">Your Grade (High School Only)</label>
            <select class="form-input" id="regStudentGrade" onchange="checkStudentGradeEligibility(this.value)">
              <option value="9">Grade 9</option>
              <option value="8">Grade 8</option>
              <option value="10">Grade 10</option>
              <option value="11">Grade 11</option>
              <option value="12">Grade 12</option>
              <option value="primary">Grade R to 7 (Primary)</option>
            </select>
          </div>
          <div id="studentFormFields">
            <div class="form-group">
              <label class="form-label">School Code</label>
              <input type="text" id="regStudentSchoolCode" class="form-input" placeholder="e.g. HCEN-2026" />
            </div>
            <div class="form-group">
              <label class="form-label">Your Full Name & Student ID</label>
              <input type="text" id="regStudentName" class="form-input" placeholder="e.g. Thabo Mokoena" style="margin-bottom:6px;" />
              <input type="text" id="regStudentID" class="form-input" placeholder="Student Admission Number (e.g. STU902)" />
            </div>
            <div class="form-group">
              <label class="form-label">Subject / Class Codes to Join</label>
              <input type="text" id="regStudentClassCodes" class="form-input" placeholder="e.g. WOOD-9B, MATH-9" />
            </div>
            <div class="form-group">
              <label class="form-label">Email / Username & Password</label>
              <input type="text" id="regStudentUser" class="form-input" placeholder="thabo@email.com or username" style="margin-bottom:6px;" />
              <input type="password" id="regStudentPass" class="form-input" placeholder="Create Password" />
            </div>
            <button class="btn btn-primary" onclick="submitStudentReg()">Create Student Account</button>
          </div>
        </div>
      `;
    }
    // 5. Staff Registration
    else if (role === 'staff') {
      c.innerHTML = `
        <div class="card" style="margin:0 0 14px 0;">
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px; color:var(--primary);">💼 School Office / Reception</h4>
          <div class="form-group">
            <label class="form-label">School Code & Staff Master PIN</label>
            <input type="text" id="regStaffSchoolCode" class="form-input" placeholder="School Code (e.g. HCEN-2026)" style="margin-bottom:6px;" />
            <input type="password" id="regStaffPin" class="form-input" placeholder="Staff Master PIN" />
          </div>
          <div class="form-group">
            <label class="form-label">Staff Full Name & Title</label>
            <input type="text" id="regStaffName" class="form-input" placeholder="e.g. Mrs. Botha - Reception" />
          </div>
          <div class="form-group">
            <label class="form-label">Email & Password</label>
            <input type="email" id="regStaffEmail" class="form-input" placeholder="office@school.co.za" style="margin-bottom:6px;" />
            <input type="password" id="regStaffPass" class="form-input" placeholder="Create Password" />
          </div>
          <button class="btn btn-primary" onclick="submitStaffReg()">Register Office Account</button>
        </div>
      `;
    }
  }

  function checkStudentGradeEligibility(val) {
    if (val === 'primary') {
      alert("⚠️ Notice: Primary School learners (Grade R to 7) cannot sign up independently. A parent must create an account and manage your diary.");
      document.getElementById('regStudentGrade').value = '9';
    }
  }

  // ================= 2. REGISTRATION SUBMISSIONS =================
  function submitSchoolReg() {
    const name = document.getElementById('regSchoolName').value.trim();
    const code = document.getElementById('regSchoolCode').value.trim().toUpperCase();
    const pin = document.getElementById('regSchoolPin').value.trim();
    const email = document.getElementById('regSchoolAdminEmail').value.trim();
    const pass = document.getElementById('regSchoolAdminPass').value.trim();
    if (!name || !code || !pin || !email || !pass) return alert("Please fill in all school registration fields!");

    db.schools[code] = {
      name: name,
      code: code,
      pin: pin,
      type: document.getElementById('regSchoolType').value,
      logo: null,
      emergencyBanner: { active: false, text: "", target: "" }
    };

    const user = {
      id: 'usr_' + Date.now(),
      role: 'school_admin',
      name: 'Principal / Admin (' + name + ')',
      email: email,
      pass: pass,
      schoolCode: code
    };
    db.users.push(user);
    db.currentUser = user;
    saveDB();
    showToast(`School ${name} registered successfully!`);
    router();
  }
